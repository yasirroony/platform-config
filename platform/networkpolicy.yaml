# Prod starts closed; allow-http opens only the app port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: myapp-prod
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-http
  namespace: myapp-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: myapp
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP

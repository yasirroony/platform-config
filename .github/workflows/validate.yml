name: validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/myapp
          path: myapp
      - uses: azure/setup-helm@v4
      - name: Render the chart with this environment's values
        run: helm template myapp myapp/chart -f envs/${{ matrix.env }}/myapp/values.yaml > /dev/null
